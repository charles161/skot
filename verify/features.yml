# Every user-facing Skot feature and the end-to-end check that proves it works.
#
#   check:          id of the @check("<id>") test in verify/features/test_features.py
#   sources:        the component and route files that make up the feature
#   prod: true      safe to run against production (no drawing, no AI calls); part of the post-deploy subset
#   needs:          long-running-server = needs one server process (in-memory signaling); skipped on Vercel
#   known_failure:  the check fails today for the reason given; it runs as a strict xfail, so the suite turns
#                   red the moment the feature works again and this line must be deleted
#
# verify/features-manifest.test.ts (part of `pnpm test`) fails when a component in src/components/jev/ or a
# page/route/manifest under src/app/ is not listed here, when a path goes stale, or when the manifest and the
# Python checks drift apart.

