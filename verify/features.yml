# Every user-facing Skot feature and the end-to-end check that proves it works.
#
#   check:          id of the @check("<id>") test in verify/features/test_features.py
#   sources:        the component and route files that make up the feature
#   prod: true      safe to run against production (no drawing, no AI calls); part of the post-deploy subset
#   needs:          long-running-server = needs one server process (in-memory signaling); skipped on Vercel
#   known_failure:  the check fails today for the reason given; it runs as a strict xfail, so the suite turns
#                   red the moment the feature works again and this line must be deleted
#
# verify/features-manifest.test.ts (part of `pnpm test`) fails when a component in src/components/jev/ or a
# page/route/manifest under src/app/ is not listed here, when a path goes stale, or when the manifest and the
# Python checks drift apart.

features:
  - id: first-load
    title: First load renders the canvas with 0 console errors and the dark theme by default
    check: first-load
    prod: true
    sources:
      - src/app/page.tsx
      - src/components/jev/JevWorkspace.tsx
      - src/components/jev/JevCanvas.tsx

  - id: beta-badge
    title: The header wordmark shows the Beta badge
    check: beta-badge
    prod: true
    sources:
      - src/app/page.tsx

  - id: starters
    title: First-run starter cards load a checkout system, a sequence morph and a Fork It demo
    check: starters
    sources:
      - src/components/jev/FirstRunEmptyState.tsx

  - id: starter-boards
    title: Six starter boards (URL shortener, chat, news feed, rate limiter, payments, notifications) load from the empty state and the Board menu with requirements, numbers, HLD, ER and sequence, fitted and undoable
    check: starter-boards
    sources:
      - src/components/jev/StarterBoardsPicker.tsx

  - id: write-to-draw
    title: Typing a flow in the Thought Bar and pressing Enter draws connected nodes
    check: write-to-draw
    sources:
      - src/components/jev/ThoughtBar.tsx
      - src/app/api/jev/decide/route.ts

  - id: core-loop-enter-creates
    title: "Core loop 1: typing a name and pressing Enter always adds one node with that name at once (AI hanging,
      one-letter names, names already on the board, jev preferring the full diagram); it never draws a diagram"
    check: core-loop-enter-creates
    sources:
      - src/components/jev/ThoughtBar.tsx
      - src/components/jev/JevWorkspace.tsx

  - id: core-loop-placement
    title: "Core loop 2: a new node lands in free space beside the selected or last-touched node, on screen, never on
      another node; nothing on the board moves; the same keys give the same layout on a second board"
    check: core-loop-placement
    sources:
      - src/components/jev/ThoughtBar.tsx
      - src/components/jev/JevWorkspace.tsx

  - id: core-loop-connections-suggested
    title: "Core loop 3: after a node is added its connection is offered as a ghost arrow, never drawn; Enter on the
      empty bar accepts it, typing the next name skips it, a late jev answer never moves the highlight, and a typed
      flow (worker -> queue) adds only the arrow that was typed"
    check: core-loop-connections-suggested
    sources:
      - src/components/jev/PredictionHud.tsx
      - src/components/jev/JevWorkspace.tsx

  - id: core-loop-ai-optional
    title: "Core loop 4: the same keys on the same board give the same board whether the AI answers, fails or hangs;
      the panel shows jev's score when it answers and stops saying deciding when it fails"
    check: core-loop-ai-optional
    sources:
      - src/components/jev/JevWorkspace.tsx
      - src/app/api/jev/decide/route.ts

  - id: core-loop-keyboard
    title: "Core loop with no mouse: the bar has the caret when the board opens, Tab completes the name, Enter adds it,
      Esc dismisses the offered connection and keeps the caret, Enter on the empty bar accepts one; AI down throughout"
    check: core-loop-keyboard
    sources:
      - src/components/jev/ThoughtBar.tsx
      - src/components/jev/PredictionHud.tsx

  - id: type-anywhere
    title: "1A: letters typed anywhere on the board go to the Thought Bar (empty board, after clicking a node:
      the node lands beside it, Backspace edits the text); tools are on Alt+letter and their buttons, Fork It on
      Alt+F and its button"
    check: type-anywhere
    sources:
      - src/components/jev/JevWorkspace.tsx
      - src/components/jev/ThoughtBar.tsx

  - id: ai-on-demand
    title: "5A: typing never calls the AI; adding or clicking a node makes one call that carries the board context,
      and the board-named next node is offered beside the highlighted option, scored by jev"
    check: ai-on-demand
    sources:
      - src/components/jev/JevWorkspace.tsx
      - src/components/jev/PredictionHud.tsx
      - src/app/api/jev/decide/route.ts

  - id: enter-needs-pick
    title: "1A: Enter on the empty bar accepts only a connection of the node just added; any other suggestion is not
      highlighted, shows no ghost and needs Tab (or its number, or a click) first"
    check: enter-needs-pick
    sources:
      - src/lib/jev/core-loop.ts
      - src/components/jev/JevWorkspace.tsx
      - src/components/jev/PredictionHud.tsx

  - id: fork-rename-keeps-arrows
    title: "8A: when a Fork take brings the selected node back under a new name (API service as API functions), the
      arrows it had to the rest of the board sit on that node, and none move to another node"
    check: fork-rename-keeps-arrows
    sources:
      - src/lib/jev/fork-engine.ts

  - id: call-budget
    title: "Drawing does not drain the AI budget: nothing is asked while a shape, label or arrow is in progress; a
      settled add, arrow, click or drag costs one call; a 6-node, 5-arrow board drawn quickly costs at most 3, and
      Fork right after it still reaches the model"
    check: call-budget
    sources:
      - src/lib/jev/settled-ask.ts
      - src/components/jev/JevWorkspace.tsx

  - id: first-screen
    title: "6A: the first screen is the bar and one Examples button; starters, practice and starter boards are
      behind it; typing a name still just works"
    check: first-screen
    sources:
      - src/components/jev/FirstRunEmptyState.tsx

  - id: phone-chips
    title: "7A: on a phone the suggestions are one row of chips above the bar, the dock covers at most a quarter of
      the screen, new nodes stay on screen, and a tap on a chip accepts it"
    check: phone-chips
    sources:
      - src/components/jev/PredictionHud.tsx
      - src/components/jev/ThoughtBar.tsx

  - id: ghost-predictions
    title: Tab cycles the three ghost predictions and Enter materializes the active one
    check: ghost-predictions
    sources:
      - src/components/jev/PredictionHud.tsx
      - src/app/api/jev/decide/route.ts

  - id: next-options-typed
    title: "S1: on a board with Client Dashboard, typing apigateway offers 3 options small to big; (a) is the one API
      Gateway node Enter adds, (b) and (c) build around it linked from Client Dashboard, nothing is duplicated"
    check: next-options-typed
    sources:
      - src/components/jev/ThoughtBar.tsx
      - src/components/jev/PredictionHud.tsx
      - src/app/api/jev/decide/route.ts

  - id: next-options-app
    title: "Board App, typing api gateway (Charles, prod 21 Nov): one API Gateway beside App is option (a), never the
      generic template dropped beside the board; the bigger options link it from App"
    check: next-options-app
    sources:
      - src/components/jev/ThoughtBar.tsx
      - src/components/jev/PredictionHud.tsx

  - id: next-options-blank
    title: "S2: on a blank board, typing url shortener offers the one typed node, a small start and the full HLD"
    check: next-options-blank
    sources:
      - src/components/jev/ThoughtBar.tsx
      - src/components/jev/PredictionHud.tsx

  - id: next-options-multi
    title: "S3: selecting Checkout and Inventory offers a labelled link, a connected Order Service and a bigger build-out"
    check: next-options-multi
    sources:
      - src/components/jev/PredictionHud.tsx

  - id: next-options-node
    title: "S4: clicking DB in Client -> API -> DB offers next steps named after it (read replica, cache, backups)"
    check: next-options-node
    sources:
      - src/components/jev/PredictionHud.tsx

  - id: type-tab-enter
    title: "S5: typing api after Client Dashboard shows the options before the word is finished; Tab completes to API
      Gateway, Enter adds it, and a second Enter accepts the offered Client Dashboard -> API Gateway link"
    check: type-tab-enter
    sources:
      - src/components/jev/ThoughtBar.tsx
      - src/components/jev/PredictionHud.tsx

  - id: context-suggestions-single
    title: Selecting one node shows suggestions named from the board context (at most one generic)
    check: context-suggestions-single
    sources:
      - src/components/jev/PredictionHud.tsx

  - id: context-suggestions-multi
    title: Selecting several nodes shows suggestions that name the selected nodes
    check: context-suggestions-multi
    sources:
      - src/components/jev/PredictionHud.tsx

  - id: arrows-connect
    title: Arrow tool and edge-handle drags connect two nodes
    check: arrows-connect
    sources:
      - src/components/jev/EdgeHandles.tsx

  - id: pen-strokes
    title: Pen strokes become predictions - connect A to B, turn a closed shape into a node, lasso to group
    check: pen-strokes
    sources:
      - src/components/jev/JevCanvas.tsx

  - id: fork-it
    title: Fork It offers three takes that reuse the board's existing nodes (no second cache or database) and every
      accepted take leaves no overlapping shapes
    check: fork-no-overlap
    sources:
      - src/components/jev/ForkHud.tsx

  - id: fork-pressure
    title: Fork It asks for a pressure first (Latency, Cost, Consistency, Scale, Availability or a typed target like
      "p99 < 100 ms"), then offers three takes that show what each buys and costs; accepting one updates the board
    check: fork-pressure
    sources:
      - src/components/jev/ForkPressureStep.tsx

  - id: notation-morph
    title: Notation Morph turns a sketch into a sequence diagram (with activation bars) or an ER diagram (PK/FK rows,
      crow's-foot ends) and back without losing nodes
    check: notation-morph
    sources:
      - src/components/jev/NotationMorphBar.tsx
      - src/components/jev/SelectionInspector.tsx

  - id: command-palette
    title: Typing / in the Thought Bar lists /er /seq /state /class /api /estimate and the moves (/break /trace /schema /failure /transitions /consistency) with keyboard selection; each inserts real notation
    check: command-palette
    sources:
      - src/components/jev/ThoughtBar.tsx

  - id: moves-break
    title: Moves menu - "Where does this break at 10×?" pins a Breaks at 10× card and an arrow next to the single DB of a 3-node board, one undo step
    check: moves-break
    sources:
      - src/components/jev/MovesMenu.tsx
      - src/app/api/jev/moves/route.ts

  - id: moves-trace
    title: /trace animates the read or write path over the board (pulse, numbered steps, legend) without adding elements; Esc stops it
    check: moves-trace
    sources:
      - src/components/jev/MoveOverlay.tsx

  - id: moves-schema
    title: /schema on a selected API card proposes ER entities with PK and FK rows to its right, joined by crow's-foot relations
    check: moves-schema
    sources:
      - src/components/jev/MovesMenu.tsx

  - id: moves-consistency
    title: /consistency compares an API card with its entity, reports the field that is not stored, and pins the API card
    check: moves-consistency
    sources:
      - src/components/jev/MoveOverlay.tsx

  - id: pack-chips
    title: Quiet pack chips - a users table becomes an entity with an id PK, a 1:N arrow label becomes crow's-foot ends
    check: pack-chips
    sources:
      - src/components/jev/PackChip.tsx
      - src/components/jev/ArrowEndPicker.tsx
      - src/components/jev/MultilineSublabelEditor.tsx

  - id: packs-panel
    title: The Packs side panel opens from the shapes flyout and the Board menu, places shapes, inserts starters, fits a phone
    check: packs-panel
    sources:
      - src/components/jev/PacksPanel.tsx
      - src/components/jev/MoreShapesMenu.tsx

  - id: more-shapes
    title: The More shapes flyout places system-design and LLD shapes (queue, ER entity) with their outlines
    check: more-shapes
    sources:
      - src/components/jev/MoreShapesMenu.tsx

  - id: arrow-end-picker
    title: The arrow inspector sets each end (crow's-foot, UML heads) and the markers render on the canvas
    check: arrow-end-picker
    sources:
      - src/components/jev/ArrowEndPicker.tsx

  - id: multiline-rows
    title: Entity rows, class members and fragment guards edit in place, one line per row
    check: multiline-rows
    sources:
      - src/components/jev/MultilineSublabelEditor.tsx

  - id: lld-shapes
    title: A UML class renders three compartments and a sequence fragment renders alt, loop and opt with guards
    check: lld-shapes
    sources:
      - src/components/jev/JevCanvas.tsx

  - id: practice-mode
    title: Practice mode runs a timed prompt with every AI surface silent; Review scores the board and pins comments on shapes
    check: practice-mode
    sources:
      - src/components/jev/PracticePicker.tsx
      - src/components/jev/PracticeHud.tsx
      - src/components/jev/PracticeReview.tsx
      - src/app/api/jev/decide/route.ts

  - id: write-to-draw-kinds
    title: The Thought Bar picks the shape from the name (kafka draws a queue)
    check: write-to-draw-kinds
    sources:
      - src/components/jev/ThoughtBar.tsx

  - id: text-note-fit
    title: A long text note grows to fit its text instead of clipping at the default 180x42 (SD Sensei, 21 Nov)
    check: text-note-fit
    sources:
      - src/components/jev/JevCanvas.tsx

  - id: inline-edit
    title: Double-click edits titles, entity rows, fragment guards, arrow and zone labels in place; on empty canvas it
      starts a text note
    check: inline-edit
    sources:
      - src/components/jev/JevCanvas.tsx

  - id: select-drag
    title: Dragging a node moves it and ends on release even over other UI; a marquee drag selects several nodes
    check: select-drag
    sources:
      - src/components/jev/JevCanvas.tsx

  - id: zoom-keys
    title: Ctrl/Cmd + = / - / 0 zoom in, out and reset; Shift+1 fits the diagram
    check: zoom-keys
    prod: true
    sources:
      - src/components/jev/JevWorkspace.tsx

  - id: duplicate
    title: Ctrl/Cmd+D duplicates the selection and rebinds arrows to the copies
    check: duplicate-arrows
    sources:
      - src/components/jev/SelectionInspector.tsx

  - id: no-emoji-icons
    title: No emoji or stock icon sets anywhere in the rendered UI
    check: no-emoji-icons
    prod: true
    sources:
      - src/app/page.tsx

  - id: link-preview
    title: Link previews - og/twitter meta with an absolute og:image that serves 200 image/png
    check: link-preview
    prod: true
    sources:
      - src/app/page.tsx

  - id: manifest-icons
    title: Web app manifest, favicon, apple icon and manifest icons all serve with the right types
    check: manifest-icons
    prod: true
    sources:
      - src/app/manifest.ts

  - id: board-import
    title: An #import= link opens the board in a fresh room; Open/Save board (.json) and Copy share link round-trip
    check: board-import
    sources:
      - src/components/jev/BoardFileMenu.tsx
      - src/components/jev/JevWorkspace.tsx

  - id: two-person-sync
    title: Two people in the same room see each other's edits live over P2P
    check: two-person-sync
    needs: long-running-server
    sources:
      - src/components/jev/ShareP2PDialog.tsx
      - src/app/api/signal/route.ts
      - src/app/api/ice-config/route.ts

internal:
  - path: src/app/api/health/route.ts
    reason: Ops health probe; the gate uses it to wait for `next start`, nobody sees it.
  - path: src/app/icons/page.tsx
    reason: Unlinked, noindex contact sheet of the icon set for design review.
